services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-cms}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cms-network

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - cms-network

  minio:
    image: bitnami/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - cms-network

  api:
    build:
      context: ../
      dockerfile: infra/Dockerfile.api
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    env_file:
      - ../.env.server
    networks:
      - cms-network

  worker:
    build:
      context: ../
      dockerfile: infra/Dockerfile.worker
    restart: always
    depends_on:
      - postgres
      - redis
      - api
    env_file:
      - ../.env.server
    networks:
      - cms-network

  renderer:
    build:
      context: ../
      dockerfile: infra/Dockerfile.renderer
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api
    env_file:
      - ../.env.server
    networks:
      - cms-network

networks:
  cms-network:
    driver: bridge

volumes:
  pgdata:
  miniodata:
